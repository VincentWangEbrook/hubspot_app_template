name: Auto Risk Label

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect high-risk changes
        id: risk
        run: |
          git fetch origin develop
          if git diff origin/develop...HEAD | grep -Ei "oauth|tenant|scopes"; then
            echo "risk=high" >> $GITHUB_OUTPUT
          else
            echo "risk=low" >> $GITHUB_OUTPUT
          fi

      - name: Apply label
        uses: actions/github-script@v7
        with:
          script: |
            const risk = "${{ steps.risk.outputs.risk }}"
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [ `${risk}-risk` ]
            })
