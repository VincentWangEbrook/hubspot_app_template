version: '3.8'

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  nest-logs:
  next-cache:

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: app-db
    env_file: .env  # 服务内配置 env_file
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hubspot_app}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # - ./sql:/docker-entrypoint-initdb.d  # 可选：初始化脚本
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hubspot_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: app-redis
    env_file: .env  # 服务内配置 env_file
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS 后端 API
  nestjs-api:
    build:
      context: ./nestjs-project
      dockerfile: Dockerfile
    container_name: app-nest-api
    env_file: .env  # 服务内配置 env_file
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hubspot_app}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/${REDIS_DB:-0}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${NESTJS_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-your-production-jwt-secret}
    volumes:
      - nest-logs:/app/logs
    networks:
      - app-network
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js 前端（SSR）
  nextjs-ssr:
    build:
      context: ./nextjs-project
      dockerfile: Dockerfile
    container_name: app-next-ssr
    env_file: .env  # 服务内配置 env_file
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://nestjs-api:${NESTJS_PORT:-3001}/api
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${NEXTJS_PORT:-3000}
    volumes:
      - next-cache:/app/.next/cache
    networks:
      - app-network
    restart: always
    depends_on:
      nestjs-api:
        condition: service_started

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: app-nginx
    env_file: .env  # 服务内配置 env_file（若 Nginx 配置需读取环境变量则保留，否则可删除）
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/logs:/var/log/nginx
      # - ./nextjs-project/out:/usr/share/nginx/html/static  # 可选：静态资源
    networks:
      - app-network
    restart: always
    depends_on:
      nextjs-ssr:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5